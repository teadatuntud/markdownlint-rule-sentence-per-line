name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The runner image has shellcheck but not shfmt.
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # The docs lint uses the rule, so test the rule first.
      - run: npm test
      - run: npm run lint
